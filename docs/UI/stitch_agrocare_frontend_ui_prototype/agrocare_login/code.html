<body class="bg-surface-muted font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-4 md:p-gutter-md orchard-bg" data-alt="A cinematic, high-resolution wide shot of a lush, professional apple orchard at golden hour. The perspective shows perfectly aligned rows of healthy trees with vibrant green leaves and ripening fruit, receding into the distance under a warm, hazy sky. The lighting is soft and atmospheric, emphasizing a dependable and fertile agricultural environment. The color palette features deep forest greens, soft technical sages, and earthy neutral tones, creating a sense of professional precision and natural abundance.">
<main class="w-full max-w-[480px] z-10 animate-fade-in">
<div class="bg-surface-main backdrop-blur-login rounded-xl shadow-lg border border-border-subtle p-8 md:p-12 transition-all duration-300">
<!-- Header Section -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-4xl mr-2" style="font-variation-settings: 'FILL' 1;">eco</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">AgroCare</h1>
</div>
<p class="font-body-md text-on-surface-variant">Sign in to manage your orchard plots and treatment schedules.</p>
</div>
<!-- Login Form -->
<form class="space-y-6" id="login-form">
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-slate-text uppercase" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-border-subtle rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-all outline-none text-body-md" id="email" name="email" placeholder="manager@orchard.com" required="" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-slate-text uppercase" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-border-subtle rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-all outline-none text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center space-x-2">
<input class="w-4 h-4 rounded border-outline-variant text-secondary focus:ring-secondary" id="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-on-surface-variant" for="remember">Remember me for 30 days</label>
</div>
<button class="w-full bg-primary-container hover:bg-primary text-white font-label-md text-headline-sm py-4 rounded-lg shadow-sm transition-all transform active:scale-[0.98] flex items-center justify-center gap-2 group" type="submit">
                    Login
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Footer Section -->
<div class="mt-10 pt-8 border-t border-border-subtle text-center">
<p class="font-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-secondary font-bold hover:text-on-secondary-container transition-colors" href="#">Register for an Orchard Account</a>
</p>
</div>
</div>
<!-- Trust Badges / Microcopy -->
<div class="mt-8 flex justify-center items-center gap-6 text-white/80 opacity-90">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span class="font-label-sm text-label-sm">Secure Access</span>
</div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-sm">cloud_done</span>
<span class="font-label-sm text-label-sm">Cloud-Sync Real-time</span>
</div>
</div>
</main>
<!-- Simple Atmospheric Effect Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                const originalContent = btn.innerHTML;
                
                // Visual feedback for interaction
                btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...`;
                btn.disabled = true;
                btn.style.opacity = '0.7';

                setTimeout(() => {
                    // Simulating success behavior
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    alert('Login successful! Redirecting to AgroCare Dashboard...');
                }, 1500);
            });

            // Focus interaction for input highlights
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.querySelector('.material-symbols-outlined').style.color = '#0e6c4a';
                });
                input.addEventListener('blur', () => {
                    input.parentElement.querySelector('.material-symbols-outlined').style.color = '#717973';
                });
            });
        });
    </script>
